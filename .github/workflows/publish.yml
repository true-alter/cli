name: Publish

# The npm publish for @truealter/cli runs HERE, in this public repository.
#
# THE REASON IS NOT TIDINESS, IT IS THAT PROVENANCE IS OTHERWISE IMPOSSIBLE.
# npm rejects `--provenance` from a private repository with HTTP 422, so a
# release cut anywhere but a public repository carries no attestation at all.
# Publishing from here is the only way the CLI gets one.
#
# Authentication is npm trusted publishing over GitHub OIDC, so this
# repository holds no secrets and needs none, and it stays that way. Trusted
# publishing is configured per package against ONE repository and ONE workflow
# path, so this file's path is part of that configuration and renaming it
# breaks the publish.
#
# ONE BRANCH, AND THAT IS DELIBERATE. The release pipeline commits the
# curated tree onto `main` with no force-push, so a visitor lands on exactly
# what publishes. This repository has one branch and that is the design.
#
# THE TRIGGER IS A DISPATCH, not a push. The release job pushes the curated
# tree here and then dispatches this workflow, so a failed release cannot
# reach npm. A push trigger would also fire on that job's own commit, which
# would publish before it had finished checking itself.
#
# BOTH DISPATCH KINDS ARE DECLARED, and the repository one is what the
# release actually uses. A repository dispatch needs only `contents:write`,
# where `gh workflow run` hits the workflow-dispatch endpoint and needs
# `actions:write`. Granting that second permission would let one automation
# start arbitrary workflows everywhere it is installed, to solve one job
# starting one workflow. `workflow_dispatch` stays for hand runs by a
# maintainer, whose own token does carry `actions:write`.
#
# NO `npm test` STEP, AND ITS ABSENCE IS THE DESIGN. This repo's own `test`
# script needs tsconfig.test.json and tests/, and the curated export ships
# neither, so the step could only ever fail. The suite runs upstream in
# alter-cli against the tree this export is cut from. `npm run build` below
# runs `tsc --noEmit` before it emits, so the exported source is type-checked
# here as well.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cli-export-published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level, so the widening is scoped to the one job that needs it and
    # the workflow default above stays read. `contents: write` is what the
    # release step below needs and nothing else here uses it. `id-token` is
    # repeated because a job-level block REPLACES the workflow default rather
    # than adding to it, and dropping it would silently break npm's OIDC.
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Meet staged publishing's floor
        # Staged publishing needs npm 11.15.0 and Node 22.14.0 or newer, and
        # Node 22 ships npm 10.x, so the CLI is upgraded here rather than
        # assumed. The floor is asserted rather than hoped for: a too-old npm
        # would treat `stage` as an unknown command and fail late with a
        # message about the argument rather than the version.
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version
          node --version
          npm stage --help >/dev/null 2>&1 || {
            echo "::error::publish: this npm has no stage command. Needs 11.15.0 or newer."
            exit 1
          }

      - run: npm ci --no-audit --no-fund

      - run: npm run build

      - name: Pack
        run: npm pack

      - name: Pre-publish sanity (packed tarball carries a real dist/)
        run: |
          set -euo pipefail
          tarball=$(ls truealter-cli-*.tgz)
          tmpdir=$(mktemp -d)
          tar -xzf "$tarball" -C "$tmpdir"
          if [ ! -d "$tmpdir/package/dist" ]; then
            echo "::error::publish: packed tarball has no package/dist. Refusing to publish."
            exit 1
          fi
          rm -rf "$tmpdir"

      - name: Founder-surface publish gate (WS1)
        # Scans the 14 markers that must never appear in the published
        # @truealter/cli artefact, on the exact tarball npm will upload rather
        # than on the source tree, so it catches anything the pack step
        # introduces. It runs where the publish runs, deliberately: a gate
        # that stayed behind when the publish moved would protect nothing.
        run: |
          set -euo pipefail
          tarball=$(ls truealter-cli-*.tgz)
          echo "Scanning $tarball for founder/principal markers..."

          tmpdir=$(mktemp -d)
          tar -xzf "$tarball" -C "$tmpdir"

          FAIL=0

          declare -a MARKERS=(
            '"~blake"'
            '"~drew"'
            'PRINCIPAL_ALLOWLIST'
            'PRINCIPAL_HANDLES'
            'PRINCIPAL_CHANNEL'
            'actAsAlterFlow'
            'act-as-alter'
            '/api/v1/auth/act-as'
            '/api/v1/admin/token-usage'
            'ALTER_PRINCIPALS'
            'ops.truealter.com'
            'publishRelease'
            'ALTER_R2_ACCOUNT_ID'
            'isPrincipalHandle'
          )

          for marker in "${MARKERS[@]}"; do
            # One cosmetics module under dist/lib carries the first marker
            # above as a documentation comment example only
            # (ws1-founder-exclusion-spec.md section 2.3). The handle is not
            # repeated here: it is a live element of MARKERS and the
            # comment-leak scanner blocks a second, explanatory copy of it in
            # prose, correctly, since prose is where a marker turns into an
            # explanation of what is being withheld. -F, because an
            # unescaped dot in a filename pattern is a wildcard and would
            # also excuse the underscored spelling.
            hits=$(grep -rl "$marker" "$tmpdir/package/dist/" 2>/dev/null \
              | grep -vF 'dist/lib/cosmetics/snippets.js' || true)
            if [ -n "$hits" ]; then
              echo "::error::FOUNDER SURFACE FOUND: '$marker' in public dist/"
              echo "$hits" | while read -r f; do
                echo "  -> $f"
              done
              FAIL=1
            fi
          done

          rm -rf "$tmpdir"

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Publish blocked: founder/principal markers detected in public artefact."
            echo "::error::Move all flagged code off the published surface before publishing."
            exit 1
          fi

          echo "Publish gate PASSED: no founder markers in public dist/"

      - name: Stage the cut for approval
        # THE CUT IS STAGED, NOT PUBLISHED, and that replaces the two-channel
        # posture rather than abandoning what it protected.
        #
        # The posture locked 2026-05-09 after Drew's v0.4.7 lockout sent every
        # cut to `principal` and moved `latest` by hand, so an unreviewed cut
        # could not reach a vanilla `npm install -g @truealter/cli`. That
        # needed `npm dist-tag add`, which a trusted publisher cannot do: npm
        # allows one trusted publisher per package with one workflow filename,
        # and its Allowed actions are `npm publish` and `npm stage publish`
        # only, with dist-tag changes still requiring traditional
        # authentication. So the old posture and a closed token path could not
        # both hold. Anchor: ruling-each-npm-package-gets-its-own-granular-
        # publish-token-never-one-automation-token-across-the-estate-2026-09-01.
        #
        # Staging gives the same protection with no credential at all. The cut
        # is staged with `latest`, and it reaches the registry only when a
        # maintainer approves it with 2FA, in the CLI or on npmjs.com. Nothing
        # unattended can put a version in front of an installer, which is a
        # stronger guarantee than the old posture gave, since a `principal`
        # cut published automatically and only the promotion was curated.
        #
        # It authenticates the same way a publish does. `StagePublish` extends
        # `Publish` with `static stage = true`, so it inherits the same
        # `oidc()` call and the same `--provenance` support; the staging path
        # is not a second, weaker route. Provenance is what this whole move is
        # for, since npm refuses it from a private repository with HTTP 422.
        #
        # IDEMPOTENT ON THE PUBLISHED SIDE ONLY. A re-dispatch on a version
        # already live stands down. A version already sitting in the stage is
        # NOT handled here, deliberately: `npm stage list`'s output shape has
        # not been observed from this repo, and inventing a parse for it would
        # be a guess in the one step that must not guess. A duplicate stage
        # fails with the registry's own message, which is legible.
        #
        # THE EXCHANGE ASSERTION IS NOT DEBUG RESIDUE. npm attempts the OIDC
        # exchange unconditionally and is written never to throw: every way it
        # can fail returns undefined behind a `log.verbose` line a default run
        # never prints. setup-node writes an .npmrc reading
        # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and, with no
        # secret to fill it, sets that variable to the literal placeholder
        # XXXXX-XXXXX-XXXXX-XXXXX, so a refused exchange does not stop the
        # step. It falls through to an unauthenticated PUT and the registry
        # answers `404 Not Found - PUT` on a package that is plainly there.
        # That second failure, which describes the retry rather than the
        # fault, cost three sessions across two days on @truealter/sdk. So the
        # log is captured, replayed in full, and searched for the exchange's
        # own refusal, which is reported as the error whatever status npm
        # returned. Every other failure keeps npm's own status and message.
        #
        # TWO REFUSAL SHAPES, BOTH OBSERVED, because one pattern would have
        # missed the other. One prints `Failed token exchange request ...
        # package not found` and falls through silently. The other is refused
        # with `403 Forbidden - OIDC permission denied for this action`, which
        # is loud but is a different string. Neither is invented here.
        #
        # `set -e` is DELIBERATELY ABSENT. With it the step dies on npm's own
        # exit before the capture is read, so the assertion never runs and
        # this whole block is decoration.
        run: |
          set -uo pipefail
          tarball=$(ls truealter-cli-*.tgz)
          version=$(node -p "require('./package.json').version")
          if npm view "@truealter/cli@${version}" version >/dev/null 2>&1; then
            echo "@truealter/cli@${version} is already live on the registry, nothing to stage."
            exit 0
          fi
          status=0
          npm stage publish "$tarball" --access public --provenance --tag latest \
            --loglevel verbose > stage.log 2>&1 || status=$?
          cat stage.log
          if grep -qE 'Failed token exchange request|OIDC permission denied' stage.log; then
            line=$(grep -m1 -E 'Failed token exchange request|OIDC permission denied' stage.log)
            echo "::error::publish: the registry REFUSED the OIDC exchange, so any status below describes npm's unauthenticated retry rather than the fault. ${line}"
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "publish: staged ${version} with tag latest. It is NOT live until approved with 2FA."
          fi
          exit "$status"

      - name: Cut the release this repo has never carried
        # Measured 2026-09-01: true-alter/cli held ZERO tags and ZERO releases
        # while the private alter-cli carried five. The npm `repository` field
        # points here, so the page a reader reaches from the listing looked
        # like a repo nobody had ever released. Same class as the broken
        # masthead images, and invisible for the same reason: the surface a
        # maintainer checks is not the surface a stranger meets.
        #
        # The export writes one squashed commit per cut, so the tag belongs on
        # that commit and there is nowhere else it could go.
        #
        # IDEMPOTENT, matching the stage step above. A re-dispatch on a
        # version already tagged stands down rather than failing.
        #
        # The release is cut even though the npm cut is only STAGED. The tag
        # records which source was cut, which is true the moment the export
        # lands and stays true whether or not the stage is approved, and the
        # body says plainly that installers do not have it yet.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release: ${tag} already exists, nothing to cut."
            exit 0
          fi
          sha=$(git rev-parse HEAD)
          notes=$(mktemp)
          {
            echo "\`@truealter/cli@${version}\` is staged on npm and reaches installers when a maintainer approves it with 2FA."
            echo
            echo '```'
            echo "npm install -g @truealter/cli"
            echo '```'
            # This version's CHANGELOG section, keyed on the version and NOT
            # on position. The first written form took the newest section and
            # that is `## [Unreleased]` in this file, so every release would
            # have carried the notes for work that is not in it. Proved
            # against the real file before this shipped: keyed on 0.8.43 it
            # returns that section, keyed on a version the file does not
            # carry it returns zero bytes and the release goes out with the
            # install line alone.
            if [ -f CHANGELOG.md ]; then
              body=$(awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## /{exit} f{print}' CHANGELOG.md)
              if [ -n "$body" ]; then
                echo
                echo "$body"
              fi
            fi
          } > "$notes"
          gh release create "$tag" --title "$tag" --notes-file "$notes" --target "$sha"
          echo "release: cut ${tag} at ${sha}."

      - name: Say what is now waiting on a human
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          {
            echo "### @truealter/cli ${version} is staged, not published"
            echo
            echo "It reaches installers only when you approve it with 2FA:"
            echo
            echo '```'
            echo "npm stage list @truealter/cli"
            echo "npm stage view <stage-id>       # inspect before approving"
            echo "npm stage approve <stage-id>    # prompts for 2FA, publishes"
            echo "npm stage reject <stage-id>     # discard"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
