name: Promote to latest

# Moves the `latest` dist-tag for @truealter/cli onto a version already
# published under `principal`. It lives here, beside publish.yml, so this
# repo is the only place the package is written from and alter-cli holds no
# npm credential at all.
#
# THE EXCHANGE IS DONE BY HAND HERE, AND THAT IS NOT A STYLE CHOICE. npm's
# OIDC support is wired into ONE command. In npm 12.0.2, lib/utils/oidc.js is
# required by lib/commands/publish.js and by nothing else, so `npm dist-tag
# add` never performs the exchange and has no credential of its own. The
# token oidc.js obtains is set on the in-memory config with
# `config.set(key, token, 'user')` and there is no `config.save()` in the
# file, so it is not written to .npmrc either: a later step in the same job
# is a fresh process and would see nothing. This is the same fact
# lesson-public-mirror-publish-step-copied-the-sdks-shape-and-dropped-alter-
# clis-channel-posture-2026-08-09 records when it says the OIDC exchange that
# authenticates the job runs inside `npm publish`.
#
# So the steps below run npm's own exchange explicitly. Request a GitHub
# id_token at audience npm:registry.npmjs.org, POST it to the registry's
# package-scoped exchange endpoint, and use the short-lived token it returns
# for the dist-tag write. No long-lived secret is stored anywhere, and it
# keeps working after "Require two-factor authentication and disallow tokens"
# is turned on for the package, because that setting closes traditional token
# auth and leaves OIDC-issued tokens working.
#
# CHANNEL POSTURE, locked 2026-05-09 after Drew's v0.4.7 lockout. `latest` is
# what a vanilla `npm install -g @truealter/cli` resolves and it is moved
# deliberately, by a person, never as a side effect of publishing. That is
# why this is a separate workflow with a required input and not a step inside
# publish.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote to `latest` (e.g. 0.8.43). Must already be published under the `principal` dist-tag."
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Refuse a version that is not on the principal channel
        # The whole point of the two-channel posture is that principal is
        # where cuts land and latest is curated from it. Promoting something
        # that never sat on principal would route around that, so it is
        # refused here rather than caught by a reader afterwards.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          principal=$(npm view "@truealter/cli" dist-tags.principal 2>/dev/null || echo '')
          if [ -z "$principal" ]; then
            echo "::error::promote: could not read the principal dist-tag. Refusing."
            exit 1
          fi
          if ! npm view "@truealter/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::promote: @truealter/cli@${VERSION} is not published. Refusing."
            exit 1
          fi
          if [ "$principal" != "$VERSION" ]; then
            echo "::error::promote: principal is ${principal}, not ${VERSION}. latest is curated from principal, so publish ${VERSION} to principal first or promote ${principal}."
            exit 1
          fi
          echo "promote: ${VERSION} is the current principal cut."

      - name: Mint a short-lived npm token from this run's OIDC identity
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Audience shape is npm:<registry hostname>, per npm's own oidc.js.
          id_token=$(curl -sf \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | jq -r '.value')
          if [ -z "$id_token" ] || [ "$id_token" = "null" ]; then
            echo "::error::promote: no GitHub id_token. Check permissions: id-token: write on this job."
            exit 1
          fi

          # Package-scoped exchange endpoint, name URL-escaped the way npm
          # escapes it (@truealter/cli -> @truealter%2fcli).
          npm_token=$(curl -sf -X POST \
            -H "Authorization: Bearer ${id_token}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@truealter%2fcli" \
            | jq -r '.token')
          if [ -z "$npm_token" ] || [ "$npm_token" = "null" ]; then
            echo "::error::promote: the registry refused the OIDC exchange. Check that @truealter/cli's trusted publisher names this repository and .github/workflows/promote-latest.yml."
            exit 1
          fi

          echo "::add-mask::${npm_token}"
          echo "NPM_EXCHANGED_TOKEN=${npm_token}" >> "$GITHUB_ENV"
          echo "promote: exchanged this run's OIDC identity for a short-lived registry token."

      - name: Move latest
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ env.NPM_EXCHANGED_TOKEN }}
        run: |
          set -euo pipefail
          npm dist-tag add "@truealter/cli@${VERSION}" latest
          echo "promote: latest is now ${VERSION}."

      - name: Confirm the registry agrees
        # A dist-tag write that reports success and did not take is the
        # failure worth catching, because the next reader is a member running
        # a vanilla install.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          now=$(npm view "@truealter/cli" dist-tags.latest)
          if [ "$now" != "$VERSION" ]; then
            echo "::error::promote: the write reported success but latest reads ${now}, not ${VERSION}."
            exit 1
          fi
          echo "promote: confirmed, latest is ${VERSION}."
